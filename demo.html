<!DOCTYPE html>
<html>
<head>
  <title>EduLearn Pro</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg,#0f0f0f,#1a1a2e);
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 15px 20px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    input {
      padding: 8px 12px;
      border-radius: 20px;
      border: none;
      width: 50%;
      outline: none;
    }

    h2 {
      margin-left: 20px;
    }

    .row {
      display: flex;
      overflow-x: auto;
      gap: 15px;
      padding: 20px;
    }

    .card {
      min-width: 220px;
      cursor: pointer;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.08);
    }

    .card img {
      width: 100%;
      border-radius: 12px;
    }

    .player {
      padding: 20px;
    }

    iframe {
      width: 100%;
      height: 300px;
      border-radius: 12px;
      border: none;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ff4c60;
      color: white;
    }

    button:hover {
      opacity: 0.8;
    }

    #quiz {
      display: none;
      padding: 20px;
      background: rgba(255,255,255,0.05);
      margin: 20px;
      border-radius: 10px;
    }

    #scoreBox {
      padding: 15px;
      text-align: center;
      font-size: 18px;
    }
  </style>
</head>

<body>

<header>
  <h3>🎓 EduLearn</h3>
  <input placeholder="Search..." onkeyup="search(this.value)">
</header>

<h2>Courses</h2>

<div class="row">
  <div class="card" onclick="play('KJ13lX20FqU','html')">
    <img src="https://img.youtube.com/vi/KJ13lX20FqU/0.jpg">
  </div>

  <div class="card" onclick="play('1Rs2ND1ryYc','css')">
    <img src="https://img.youtube.com/vi/1Rs2ND1ryYc/0.jpg">
  </div>

  <div class="card" onclick="play('PkZNo7MFNFg','js')">
    <img src="https://img.youtube.com/vi/PkZNo7MFNFg/0.jpg">
  </div>
</div>

<div class="player" id="playerBox"></div>

<div id="scoreBox">Score: <span id="score">0</span></div>

<!-- QUIZ -->
<div id="quiz">
  <h3 id="q"></h3>
  <button onclick="answer('a')" id="a"></button>
  <button onclick="answer('b')" id="b"></button>
  <button onclick="answer('c')" id="c"></button>
  <p id="result"></p>
</div>

<script>
let score = 0;
let correct = "a";
let currentVideo = "";

const quizData = {
  html: {
    q: "What does HTML stand for?",
    a: "Hyper Text Markup Language",
    b: "High Tool Machine Language",
    c: "Home Tool Markup Language",
    correct: "a"
  },
  css: {
    q: "What is CSS used for?",
    a: "Structure",
    b: "Styling",
    c: "Database",
    correct: "b"
  },
  js: {
    q: "JavaScript is used for?",
    a: "Styling",
    b: "Structure",
    c: "Interactivity",
    correct: "c"
  }
};

function play(id, type) {
  currentVideo = id;

  document.getElementById("playerBox").innerHTML = `
    <iframe id="player" src="https://www.youtube.com/embed/${id}?autoplay=1"></iframe>

    <div class="controls">
      <button onclick="goFullscreen()">Fullscreen</button>
    </div>
  `;

  document.getElementById("quiz").style.display = "none";

  setTimeout(() => showQuiz(type), 8000);
}

function goFullscreen() {
  let iframe = document.getElementById("player");

  if (iframe.requestFullscreen) {
    iframe.requestFullscreen();
  }
}

function showQuiz(type) {
  let q = quizData[type];

  document.getElementById("quiz").style.display = "block";
  document.getElementById("q").innerText = q.q;

  document.getElementById("a").innerText = q.a;
  document.getElementById("b").innerText = q.b;
  document.getElementById("c").innerText = q.c;

  correct = q.correct;
}

function answer(ans) {
  if (ans === correct) {
    score++;
    document.getElementById("result").innerText = "✅ Correct!";
  } else {
    document.getElementById("result").innerText = "❌ Wrong!";
  }

  document.getElementById("score").innerText = score;
}

function search(val) {
  val = val.toLowerCase();

  document.querySelectorAll(".card").forEach(c=>{
    c.style.display = val === "" ? "block" : "none";
  });
}
</script>

</body>
</html>
