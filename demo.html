<!DOCTYPE html>
<html>
<head>
  <title>EduLearn Ultra</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui;
      background: #0b0b0f;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      background: #111;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    input {
      padding: 6px 10px;
      border-radius: 20px;
      border: none;
      width: 50%;
    }

    h2 {
      margin: 10px;
      font-size: 16px;
    }

    .row {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding: 10px;
      scroll-snap-type: x mandatory;
    }

    .card {
      min-width: 140px;
      scroll-snap-align: start;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      border-radius: 6px;
    }

    iframe {
      width: 100%;
      height: 220px;
      border: none;
    }

    #quiz {
      display: none;
      padding: 10px;
    }

    button {
      margin: 5px;
      padding: 8px;
      border: none;
      border-radius: 5px;
      background: #ff4c60;
      color: white;
    }

    #score {
      padding: 10px;
      font-size: 16px;
    }

    /* Bottom nav */
    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #111;
      display: flex;
      justify-content: space-around;
      padding: 8px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <b>EduLearn</b>
  <input placeholder="Search...">
</header>

<h2>Web Dev</h2>
<div class="row">
  <div class="card" onclick="play('KJ13lX20FqU','html')">
    <img src="https://img.youtube.com/vi/KJ13lX20FqU/0.jpg">
  </div>

  <div class="card" onclick="play('1Rs2ND1ryYc','css')">
    <img src="https://img.youtube.com/vi/1Rs2ND1ryYc/0.jpg">
  </div>

  <div class="card" onclick="play('PkZNo7MFNFg','js')">
    <img src="https://img.youtube.com/vi/PkZNo7MFNFg/0.jpg">
  </div>
</div>

<h2>Programming</h2>
<div class="row">
  <div class="card" onclick="play('rfscVS0vtbw','python')">
    <img src="https://img.youtube.com/vi/rfscVS0vtbw/0.jpg">
  </div>
</div>

<div id="player"></div>

<div id="quiz">
  <h3 id="q"></h3>
  <button onclick="answer('a')" id="a"></button>
  <button onclick="answer('b')" id="b"></button>
  <button onclick="answer('c')" id="c"></button>
  <p id="result"></p>
</div>

<div id="score">Score: 0</div>

<div class="nav">
  <div>🏠 Home</div>
  <div>📚 Courses</div>
  <div>👤 Profile</div>
</div>

<script>
let score = 0;
let correct = "a";

const quizData = {
  html: {
    q: "HTML stands for?",
    a: "Hyper Text Markup Language",
    b: "Machine Language",
    c: "Home Tool",
    correct: "a"
  },
  css: {
    q: "CSS is for?",
    a: "Structure",
    b: "Styling",
    c: "Database",
    correct: "b"
  },
  js: {
    q: "JS is for?",
    a: "Styling",
    b: "Structure",
    c: "Interactivity",
    correct: "c"
  },
  python: {
    q: "Python is used for?",
    a: "AI & Web",
    b: "Nothing",
    c: "Only games",
    correct: "a"
  }
};

function play(id, type) {
  document.getElementById("player").innerHTML =
    `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen></iframe>`;

  document.getElementById("quiz").style.display = "none";

  setTimeout(() => showQuiz(type), 7000);
}

function showQuiz(type) {
  let q = quizData[type];

  document.getElementById("quiz").style.display = "block";
  document.getElementById("q").innerText = q.q;

  document.getElementById("a").innerText = q.a;
  document.getElementById("b").innerText = q.b;
  document.getElementById("c").innerText = q.c;

  correct = q.correct;
}

function answer(ans) {
  if (ans === correct) {
    score++;
    document.getElementById("result").innerText = "✅ Correct";
  } else {
    document.getElementById("result").innerText = "❌ Wrong";
  }

  document.getElementById("score").innerText = "Score: " + score;
}
</script>

</body>
</html>
