<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduLearn</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <h1>🎓 EduLearn</h1>
</header>

<section class="player-section">
  <h2>▶ Now Playing</h2>

  <div class="video-container">
    <iframe 
      id="player"
      src="https://www.youtube.com/embed/UB1O30fR-EE"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
</section>

<section class="courses">
  <h2>📺 Courses</h2>

  <div class="grid">

    <div class="card" onclick="loadVideo('UB1O30fR-EE')">
      <img src="https://img.youtube.com/vi/UB1O30fR-EE/0.jpg">
      <p>HTML Basics</p>
    </div>

    <div class="card" onclick="loadVideo('yfoY53QXEnI')">
      <img src="https://img.youtube.com/vi/yfoY53QXEnI/0.jpg">
      <p>CSS Basics</p>
    </div>

    <div class="card" onclick="loadVideo('PkZNo7MFNFg')">
      <img src="https://img.youtube.com/vi/PkZNo7MFNFg/0.jpg">
      <p>JavaScript Basics</p>
    </div>

    <div class="card" onclick="loadVideo('rfscVS0vtbw')">
      <img src="https://img.youtube.com/vi/rfscVS0vtbw/0.jpg">
      <p>Python Full Course</p>
    </div>

  </div>
</section>

<script src="app.js"></script>
</body>
</html>
