<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduLearn</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <h1>EduLearn</h1>
  <div class="score">⭐ <span id="score">0</span></div>
</header>

<main>

  <!-- LEFT: VIDEO -->
  <section class="left">
    <div class="video-box">
      <iframe 
        id="player"
        src="https://www.youtube.com/embed/UB1O30fR-EE"
        allowfullscreen>
      </iframe>
    </div>

    <div class="video-info">
      <h2 id="title">HTML Basics</h2>
      <p>Learn the fundamentals of web development</p>
    </div>
  </section>

  <!-- RIGHT: VIDEOS -->
  <aside class="right">

    <div class="card" onclick="loadVideo('UB1O30fR-EE','HTML Basics')">
      <img src="https://img.youtube.com/vi/UB1O30fR-EE/0.jpg">
      <div>
        <h4>HTML Basics</h4>
        <p>Start building websites</p>
      </div>
    </div>

    <div class="card" onclick="loadVideo('yfoY53QXEnI','CSS Design')">
      <img src="https://img.youtube.com/vi/yfoY53QXEnI/0.jpg">
      <div>
        <h4>CSS Design</h4>
        <p>Modern UI styling</p>
      </div>
    </div>

    <div class="card" onclick="loadVideo('PkZNo7MFNFg','JavaScript')">
      <img src="https://img.youtube.com/vi/PkZNo7MFNFg/0.jpg">
      <div>
        <h4>JavaScript</h4>
        <p>Make websites interactive</p>
      </div>
    </div>

    <div class="card" onclick="loadVideo('rfscVS0vtbw','Python Course')">
      <img src="https://img.youtube.com/vi/rfscVS0vtbw/0.jpg">
      <div>
        <h4>Python Course</h4>
        <p>Full programming guide</p>
      </div>
    </div>

  </aside>

</main>

<script src="app.js"></script>
</body>
</html>
