<!DOCTYPE html>
<html>
<head>
  <title>EduLearn Ultra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui;
      background: #0b0b0f;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      background: #111;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    input {
      padding: 6px 10px;
      border-radius: 20px;
      border: none;
      width: 45%;
    }

    .score {
      background: #ff4c60;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: 220px;
      border: none;
    }

    #player {
      display: none;
    }

    h2 {
      margin: 12px;
    }

    /* ROW */
    .row {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding: 10px;
    }

    .card {
      min-width: 140px;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      border-radius: 6px;
    }

    /* SHORTS */
    .shorts {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding: 10px;
    }

    .short {
      min-width: 100px;
      height: 180px;
      background: #222;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* QUIZ */
    #quiz {
      display: none;
      padding: 10px;
      border-top: 1px solid #222;
    }

    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
    }

    #progress {
      height: 5px;
      background: #333;
    }

    #bar {
      height: 5px;
      width: 0%;
      background: #ff4c60;
    }

    /* NAV */
    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #111;
      display: flex;
      justify-content: space-around;
      padding: 8px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <b>🎓 EduLearn</b>
  <input placeholder="Search...">
  <div class="score">⭐ <span id="score">0</span></div>
</header>

<div id="player"></div>

<div id="progress"><div id="bar"></div></div>

<h2>🔥 Continue Watching</h2>
<div class="row" id="continue"></div>

<h2>🎬 Shorts</h2>
<div class="shorts">
  <div class="short" onclick="play('PkZNo7MFNFg','js')">JS</div>
  <div class="short" onclick="play('KJ13lX20FqU','html')">HTML</div>
  <div class="short" onclick="play('1Rs2ND1ryYc','css')">CSS</div>
</div>

<h2>💻 Courses</h2>
<div class="row">
  <div class="card" onclick="play('KJ13lX20FqU','html')">
    <img src="https://img.youtube.com/vi/KJ13lX20FqU/0.jpg">
  </div>

  <div class="card" onclick="play('1Rs2ND1ryYc','css')">
    <img src="https://img.youtube.com/vi/1Rs2ND1ryYc/0.jpg">
  </div>

  <div class="card" onclick="play('PkZNo7MFNFg','js')">
    <img src="https://img.youtube.com/vi/PkZNo7MFNFg/0.jpg">
  </div>

  <div class="card" onclick="play('rfscVS0vtbw','python')">
    <img src="https://img.youtube.com/vi/rfscVS0vtbw/0.jpg">
  </div>
</div>

<div id="quiz">
  <h3 id="q"></h3>
  <button onclick="answer('a')" id="a"></button>
  <button onclick="answer('b')" id="b"></button>
  <button onclick="answer('c')" id="c"></button>
  <p id="result"></p>
</div>

<div class="nav">
  <div>🏠 Home</div>
  <div>📚 Courses</div>
  <div>👤 Profile</div>
</div>

<script>
let score = 0;
let correct = "a";

const quizData = {
  html: {
    q: "HTML stands for?",
    a: "Hyper Text Markup Language",
    b: "Machine Language",
    c: "Home Tool",
    correct: "a"
  },
  css: {
    q: "CSS is for?",
    a: "Structure",
    b: "Styling",
    c: "Database",
    correct: "b"
  },
  js: {
    q: "JS is for?",
    a: "Styling",
    b: "Structure",
    c: "Interactivity",
    correct: "c"
  },
  python: {
    q: "Python is used for?",
    a: "AI & Web",
    b: "Nothing",
    c: "Only games",
    correct: "a"
  }
};

function play(id, type) {
  let player = document.getElementById("player");

  player.innerHTML =
    `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen></iframe>`;
  player.style.display = "block";

  window.scrollTo({ top: 0, behavior: "smooth" });

  document.getElementById("quiz").style.display = "none";

  // progress bar
  let bar = document.getElementById("bar");
  bar.style.width = "0%";
  let i = 0;
  let interval = setInterval(()=>{
    i+=1;
    bar.style.width = i + "%";
    if(i>=100) clearInterval(interval);
  },70);

  // continue watching
  let cont = document.getElementById("continue");
  cont.innerHTML =
    `<div class="card">
      <img src="https://img.youtube.com/vi/${id}/0.jpg">
    </div>`;

  setTimeout(() => showQuiz(type), 7000);
}

function showQuiz(type) {
  let q = quizData[type];

  document.getElementById("quiz").style.display = "block";
  document.getElementById("q").innerText = q.q;

  document.getElementById("a").innerText = q.a;
  document.getElementById("b").innerText = q.b;
  document.getElementById("c").innerText = q.c;

  correct = q.correct;
}

function answer(ans) {
  if (ans === correct) {
    score++;
    document.getElementById("result").innerText = "✅ Correct";
  } else {
    document.getElementById("result").innerText = "❌ Wrong";
  }

  document.getElementById("score").innerText = score;
}
</script>

</body>
</html>
