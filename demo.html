<!DOCTYPE html>
<html>
<head>
  <title>EduLearn Mobile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: #0b0b0f;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    input {
      padding: 6px 10px;
      border-radius: 20px;
      border: none;
      width: 50%;
    }

    /* HERO */
    .hero {
      height: 180px;
      background: linear-gradient(to right, black, transparent),
        url("https://img.youtube.com/vi/PkZNo7MFNFg/maxresdefault.jpg");
      background-size: cover;
      display: flex;
      align-items: flex-end;
      padding: 15px;
      animation: fadeIn 1s ease;
    }

    .hero button {
      padding: 8px 15px;
      background: #ff4c60;
      border: none;
      border-radius: 6px;
    }

    h2 {
      margin: 15px;
    }

    /* ROW */
    .row {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      padding: 10px;
    }

    .card {
      min-width: 140px;
      transition: 0.3s;
      animation: slideUp 0.6s ease;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      border-radius: 8px;
    }

    iframe {
      width: 100%;
      height: 220px;
      border: none;
      margin-top: 10px;
      animation: fadeIn 0.5s ease;
    }

    /* QUIZ */
    #quiz {
      display: none;
      margin: 15px;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      animation: fadeIn 0.5s ease;
    }

    button {
      margin: 5px;
      padding: 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    #score {
      padding: 15px;
      font-size: 18px;
    }

    /* BOTTOM NAV (mobile) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #111;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    .bottom-nav div {
      text-align: center;
      font-size: 12px;
      color: #aaa;
    }

    /* ANIMATIONS */
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes slideUp {
      from {transform: translateY(20px); opacity: 0;}
      to {transform: translateY(0); opacity: 1;}
    }

    /* RESPONSIVE */
    @media(min-width: 768px) {
      iframe {
        height: 400px;
      }

      .card {
        min-width: 220px;
      }

      .hero {
        height: 250px;
      }
    }
  </style>
</head>

<body>

<header>
  <h3>🎓 EduLearn</h3>
  <input placeholder="Search...">
</header>

<!-- HERO -->
<div class="hero">
  <div>
    <h3>JavaScript Course</h3>
    <button onclick="play('PkZNo7MFNFg','js')">▶ Play</button>
  </div>
</div>

<h2>Web Development</h2>
<div class="row">
  <div class="card" onclick="play('KJ13lX20FqU','html')">
    <img src="https://img.youtube.com/vi/KJ13lX20FqU/0.jpg">
  </div>

  <div class="card" onclick="play('1Rs2ND1ryYc','css')">
    <img src="https://img.youtube.com/vi/1Rs2ND1ryYc/0.jpg">
  </div>

  <div class="card" onclick="play('PkZNo7MFNFg','js')">
    <img src="https://img.youtube.com/vi/PkZNo7MFNFg/0.jpg">
  </div>
</div>

<h2>Programming</h2>
<div class="row">
  <div class="card" onclick="play('rfscVS0vtbw','python')">
    <img src="https://img.youtube.com/vi/rfscVS0vtbw/0.jpg">
  </div>
</div>

<div id="player"></div>

<div id="quiz">
  <h3 id="q"></h3>
  <button onclick="answer('a')" id="a"></button>
  <button onclick="answer('b')" id="b"></button>
  <button onclick="answer('c')" id="c"></button>
  <p id="result"></p>
</div>

<div id="score">Score: 0</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div>🏠 Home</div>
  <div>📚 Courses</div>
  <div>👤 Profile</div>
</div>

<script>
let score = 0;
let correct = "a";

const quizData = {
  html: {
    q: "HTML stands for?",
    a: "Hyper Text Markup Language",
    b: "High Machine Language",
    c: "Home Tool",
    correct: "a"
  },
  css: {
    q: "CSS is used for?",
    a: "Structure",
    b: "Styling",
    c: "Backend",
    correct: "b"
  },
  js: {
    q: "JS is used for?",
    a: "Styling",
    b: "Structure",
    c: "Interactivity",
    correct: "c"
  },
  python: {
    q: "Python is used for?",
    a: "AI & Web",
    b: "Nothing",
    c: "Only games",
    correct: "a"
  }
};

function play(id, type) {
  document.getElementById("player").innerHTML =
    `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen></iframe>`;

  document.getElementById("quiz").style.display = "none";

  setTimeout(() => showQuiz(type), 8000);
}

function showQuiz(type) {
  let q = quizData[type];

  document.getElementById("quiz").style.display = "block";
  document.getElementById("q").innerText = q.q;

  document.getElementById("a").innerText = q.a;
  document.getElementById("b").innerText = q.b;
  document.getElementById("c").innerText = q.c;

  correct = q.correct;
}

function answer(ans) {
  if (ans === correct) {
    score++;
    document.getElementById("result").innerText = "✅ Correct!";
  } else {
    document.getElementById("result").innerText = "❌ Wrong!";
  }

  document.getElementById("score").innerText = "Score: " + score;
}
</script>

</body>
</html>
