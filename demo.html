<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduLearn</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <h1>EduLearn</h1>
  <div class="score">⭐ <span id="score">0</span></div>
</header>

<main>

  <!-- PLAYER -->
  <section class="player">
    <iframe 
      id="player"
      src="https://www.youtube.com/embed/UB1O30fR-EE"
      allowfullscreen>
    </iframe>
  </section>

  <!-- COURSES -->
  <section class="courses">
    <h2>Courses</h2>

    <div class="grid">

      <div class="card" onclick="loadVideo('UB1O30fR-EE')">
        <img src="https://img.youtube.com/vi/UB1O30fR-EE/0.jpg">
        <h3>HTML Basics</h3>
        <p>Start building websites</p>
      </div>

      <div class="card" onclick="loadVideo('yfoY53QXEnI')">
        <img src="https://img.youtube.com/vi/yfoY53QXEnI/0.jpg">
        <h3>CSS Design</h3>
        <p>Modern UI styling</p>
      </div>

      <div class="card" onclick="loadVideo('PkZNo7MFNFg')">
        <img src="https://img.youtube.com/vi/PkZNo7MFNFg/0.jpg">
        <h3>JavaScript</h3>
        <p>Make websites interactive</p>
      </div>

      <div class="card" onclick="loadVideo('rfscVS0vtbw')">
        <img src="https://img.youtube.com/vi/rfscVS0vtbw/0.jpg">
        <h3>Python</h3>
        <p>Full course</p>
      </div>

    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
